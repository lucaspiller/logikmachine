[package]
name = "logiksmith-desktop"
version = "0.1.0"
edition = "2024"

[features]
# The desktop release is the complete service. Embedded hosts can opt into
# just the capabilities they actually provide.
default = ["timezones", "astronomy", "http-inputs", "webhook-inputs", "vendored-lua"]
timezones = ["logiksmith-core/timezones", "logiksmith-runtime-api/timezones"]
astronomy = ["logiksmith-core/astronomy", "logiksmith-runtime-api/astronomy"]
http-inputs = ["dep:reqwest", "logiksmith-core/http-inputs", "logiksmith-runtime-api/http-inputs"]
webhook-inputs = ["logiksmith-core/webhook-inputs", "logiksmith-runtime-api/webhook-inputs"]
vendored-lua = ["logiksmith-core/vendored-lua"]
external-inputs = ["http-inputs", "webhook-inputs"]

[dependencies]
axum = "0.8"
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
jiff = { version = "0.2", default-features = false, features = ["std"] }
logiksmith-core = { path = "../logiksmith-core", default-features = false }
logiksmith-runtime-api = { path = "../logiksmith-runtime-api", default-features = false }
reqwest = { version = "0.12", optional = true, default-features = false, features = ["rustls-tls-native-roots", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
